[platformio]
default_envs = panel-bench
boards_dir = .vendor/lilygo/board

[env:panel-bench]
platform = espressif32@6.5.0
platform_packages =
  platformio/framework-arduinoespressif32@3.20014.231204
  platformio/tool-esptoolpy@1.40501.0
  platformio/tool-scons@4.40801.0
board = T-Display-Long
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_extra_dirs = .vendor/lilygo/lib
lib_deps = bblanchon/ArduinoJson@6.21.5
