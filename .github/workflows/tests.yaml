---
name: Testing

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DEFAULT_PYTHON: "3.14"

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.14"]
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: 🐍 Install Python
        run: uv python install
      - name: 🏗 Install dependencies
        run: uv sync --locked
      - name: 🏗 Prepare firmware dependencies
        run: uv run --locked python scripts/prepare_firmware.py
      - name: 🏗 Build firmware
        run: uv run --locked pio run --project-dir firmware
      - name: 🚀 Run host and native firmware tests
        run: uv run --locked python scripts/check_tests.py
      - name: 🏗 Package candidate artifacts
        if: matrix.python == env.DEFAULT_PYTHON
        run: uv run --locked python scripts/release_artifacts.py --output artifacts/candidate
      - name: ⬆️ Upload firmware artifacts
        if: matrix.python == env.DEFAULT_PYTHON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-${{ github.sha }}
          path: artifacts/candidate/
          if-no-files-found: error
          retention-days: 30
