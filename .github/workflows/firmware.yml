name: Firmware

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.32'
          python-version: '3.14.6'
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.11.1'
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint and syntax
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          node --check preview/app.js
      - name: Check generated assets
        run: uv run --locked python scripts/generate_demo_assets.py --check
      - name: Prepare pinned manufacturer sources
        run: uv run --locked python scripts/prepare_firmware.py
      - name: Build application (no upload)
        run: uv run --locked pio run --project-dir firmware
      - name: Host, native firmware and consumer contract tests (no skips)
        run: uv run --locked python scripts/check_tests.py
      - name: Package commit artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: uv run --locked python scripts/release_artifacts.py --output artifacts/ci-release
      - name: Validate release tag and package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          uv run --locked python scripts/release_artifacts.py --tag "$RELEASE_TAG" --output artifacts/ci-release
      - name: Upload immutable commit artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: panel-${{ github.sha }}
          path: artifacts/ci-release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft firmware release
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: panel-${{ github.sha }}
          path: release-files
      - name: Verify artifact digests
        working-directory: release-files
        run: sha256sum --check SHA256SUMS
      - name: Create draft for operator review (no deployment)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Panel $RELEASE_TAG" --notes-file release-files/CHANGELOG.md release-files/firmware.bin release-files/manifest.json release-files/SHA256SUMS release-files/protocol-core.tar.gz release-files/CHANGELOG.md
