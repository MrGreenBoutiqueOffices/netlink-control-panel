[project]
name = "netlink-panel"
version = "0.8.0"
description = "USB and authenticated Wi-Fi bench prototype for the NetLink LILYGO control panel"
requires-python = ">=3.11"
dependencies = [
    "cryptography==50.0.2",
    "pyserial==3.5",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "platformio==6.1.18",
    "pymupdf==2.1",
    "pillow==13.0.0",
    "yamllint==1.38.0",
]

[project.scripts]
panel = "netlink_panel.cli:main"
panel-service = "netlink_panel.service:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["host/netlink_panel"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["firmware/.vendor", "firmware/.pio"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
